<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d17">
  <meta name="description" content="Do nome da música ao timbre pronto na M-VAVE MK-300.">
  <title>ToneMatch MK-300</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="34" height="34">
        <h1>TONEMATCH <b>MK-300</b></h1>
        <button class="iconbtn" id="gear" aria-label="Ajustes">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <nav class="tabs" id="tabs" aria-label="Seções">
        <button data-tab="timbre" class="on">TIMBRE</button>
        <button data-tab="lib">BIBLIOTECA</button>
        <button data-tab="live">AO VIVO</button>
      </nav>
    </header>
    <section class="conn" id="conn" aria-label="Conexão com a pedaleira"></section>
    <main id="main"></main>
    <div class="foot">ToneMatch MK-300 · uso pessoal · protocolo USB da MK-300 por engenharia reversa (projeto aberto jpfaria/mvave, licença MIT)</div>
  </div>
  <div id="layer"></div>
  <noscript>O ToneMatch precisa de JavaScript ligado.</noscript>
</body>
</html>
